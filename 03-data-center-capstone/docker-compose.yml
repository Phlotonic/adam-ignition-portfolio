---
# =============================================================================
# docker-compose.yml — Regenerative Data Center Capstone Full Stack
#
# Services:
#   timescaledb    — PostgreSQL 15 + TimescaleDB extension (time-series DB)
#   mosquitto      — Eclipse Mosquitto 2.0 MQTT broker
#   anomaly-agent  — FastAPI anomaly detection service (built from ./Dockerfile)
#   simulator      — Multi-pod telemetry simulator (built from ./Dockerfile.simulator)
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f
# Stop:   docker compose down
# Reset:  docker compose down --volumes  (WARNING: deletes all persisted data)
# =============================================================================

# =============================================================================
# SHARED NETWORK
# =============================================================================
networks:
  datacenter_net:
    name: datacenter_net
    driver: bridge


services:

  # ===========================================================================
  # TIMESCALEDB
  # TimescaleDB is a PostgreSQL extension that adds:
  #   - Hypertables: automatically partitioned by time into 'chunks'
  #   - time_bucket(): arbitrary time interval aggregation function
  #   - Continuous aggregates: incrementally refreshed materialized views
  #   - Data retention policies: automatic chunk expiration
  # ===========================================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: unless-stopped
    networks:
      - datacenter_net

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB:       datacenter
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme}"

    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      # Auto-run SQL files on first init (when data volume is empty)
      - ./init-scripts:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datacenter"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # MOSQUITTO MQTT BROKER
  # ===========================================================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - datacenter_net

    ports:
      - "1883:1883"   # MQTT TCP
      - "9001:9001"   # MQTT WebSocket

    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "1883",
             "-t", "$$SYS/broker/version", "-C", "1", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ===========================================================================
  # FASTAPI ANOMALY AGENT
  # ===========================================================================
  anomaly-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anomaly-agent
    restart: unless-stopped
    networks:
      - datacenter_net

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD:-changeme}@timescaledb:5432/datacenter"
      MQTT_BROKER_HOST: "mosquitto"
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC: "spBv1.0/DataCenter/NDATA/+"
      IGNITION_WEBHOOK_URL: "${IGNITION_WEBHOOK_URL:-}"
      ANOMALY_BUFFER_SIZE:      "100"
      ANOMALY_IF_FIT_THRESHOLD: "50"
      ANOMALY_IF_CONTAMINATION: "0.05"

    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1",
             "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ===========================================================================
  # POD TELEMETRY SIMULATOR
  # Publishes synthetic multi-pod thermodynamics and economic metrics to MQTT
  # ===========================================================================
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: pod-simulator
    restart: unless-stopped
    networks:
      - datacenter_net

    environment:
      MQTT_BROKER_HOST: "mosquitto"
      MQTT_BROKER_PORT: "1883"
      PUBLISH_INTERVAL_SEC: "5.0"

    depends_on:
      mosquitto:
        condition: service_healthy


# =============================================================================
# NAMED VOLUMES
# =============================================================================
volumes:
  timescaledb_data:
    name: dc_timescaledb_data
  mosquitto_data:
    name: dc_mosquitto_data
  mosquitto_log:
    name: dc_mosquitto_log
