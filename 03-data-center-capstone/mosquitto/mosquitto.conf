# =============================================================================
# mosquitto.conf — Eclipse Mosquitto 2.0 (Data Center Capstone)
# Same configuration as Project 2; included here so this project is standalone.
# =============================================================================

listener 1883
bind_address 0.0.0.0
protocol mqtt

listener 9001
bind_address 0.0.0.0
protocol websockets

# WARNING: Development only — disable in production and configure auth + TLS
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

max_connections 500
message_size_limit 1048576
max_queued_messages 1000
