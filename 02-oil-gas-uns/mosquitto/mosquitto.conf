# =============================================================================
# mosquitto.conf — Eclipse Mosquitto 2.0 Broker Configuration
#
# This configuration is designed for development and demonstration.
# It enables:
#   - Standard MQTT on TCP port 1883
#   - MQTT over WebSocket on port 9001
#   - Anonymous access (no auth required)
#   - Message persistence to disk
#   - File-based logging
#
# PRODUCTION CHECKLIST (items to change before deploying to a real field site):
#   [ ] Set allow_anonymous to false
#   [ ] Add a password_file with per-device credentials
#   [ ] Configure TLS: cafile, certfile, keyfile on port 8883
#   [ ] Disable plain port 1883 (keep TLS-only port 8883)
#   [ ] Set require_certificate true for mutual TLS (RTU client certs)
#   [ ] Add per-topic ACLs via acl_file to restrict which clients can publish where
#   [ ] Configure max_keepalive to match cellular RTU heartbeat intervals
# =============================================================================

# =============================================================================
# LISTENER: Standard MQTT (TCP)
# Port 1883 is the IANA-registered default for unencrypted MQTT.
# Used by: Ignition MQTT Engine, paho-mqtt clients, RTU firmware
# =============================================================================
listener 1883
# Bind to all network interfaces (0.0.0.0).
# In production, bind to a specific interface: bind_address 10.0.1.5
bind_address 0.0.0.0

# Protocol: mqtt (standard) — not websockets on this listener
protocol mqtt

# =============================================================================
# LISTENER: MQTT over WebSocket
# Port 9001 enables browser-based MQTT clients (MQTT.js, Paho JS).
# Useful for: MQTT Explorer web interface, Perspective WebSocket bindings,
#             debugging tools that run in a browser
# =============================================================================
listener 9001
bind_address 0.0.0.0
protocol websockets

# =============================================================================
# AUTHENTICATION
# WARNING: allow_anonymous true is only appropriate for development.
# Any client on the network can publish/subscribe to any topic.
# In production: set to false and configure password_file.
# =============================================================================
allow_anonymous true

# Production example (commented out):
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# =============================================================================
# PERSISTENCE
# Enables the broker to save retained messages, subscriptions, and
# in-flight QoS 1/2 messages to disk. Without persistence, all state
# is lost on broker restart — Sparkplug B nodes will need to re-send
# NBIRTH after a broker restart regardless, but persistence preserves
# retained system topic data.
# =============================================================================
persistence true
persistence_location /mosquitto/data/

# Save the persistence file every 60 seconds AND after every
# autosave_interval messages. Lower values = more durable, higher I/O.
autosave_interval 60

# =============================================================================
# LOGGING
# Logs connection events, errors, and statistics to a file.
# In production, also configure a syslog destination for centralized log mgmt.
# =============================================================================
log_dest file /mosquitto/log/mosquitto.log

# Log severity levels to include:
#   error   — broker errors (always enable)
#   warning — non-fatal issues
#   notice  — significant events (connects, subscribes)
#   information — general operational messages
# In production, reduce to 'error warning notice' to limit log volume.
log_type error
log_type warning
log_type notice
log_type information

# Log the source IP and port for each client connection
log_timestamp true

# =============================================================================
# CONNECTION TUNING
# These defaults are appropriate for a mixed field/office environment.
# Adjust keepalive values based on your RTU firmware's heartbeat settings.
# =============================================================================

# Maximum number of simultaneous client connections.
# Default: unlimited. Set a limit to protect broker resources.
max_connections 500

# Maximum time a client can be silent before the broker considers it dead.
# Cellular RTUs typically set keepalive to 60–300s; set this to at least 1.5×
# the longest expected RTU keepalive.
# Default: 65535 seconds (effectively unlimited)
# Production recommendation: 600 (10 minutes) for cellular RTUs
# max_keepalive 600

# Maximum size of a single MQTT message in bytes.
# NBIRTH messages can be large (all metric descriptors). 1MB is generous.
message_size_limit 1048576

# QoS 1 and 2 message queue size per client (in-flight + queued while offline)
# Important for store-and-forward: if an RTU with poor connectivity has 1000
# queued messages, they should not be silently dropped.
max_queued_messages 1000

# =============================================================================
# SPARKPLUG B NOTES
# Sparkplug B uses MQTT QoS 0 and QoS 1. QoS 2 is NOT used.
#
# Topic retention: Sparkplug B explicitly states that NBIRTH/NDATA messages
# should NOT be retained (retain=false). The NBIRTH lifecycle handles state
# recovery — retained NBIRTH messages can cause stale state in consumers after
# a node restart.
#
# $SYS topics: Mosquitto publishes broker statistics to $SYS/broker/... topics
# every 10 seconds. These are useful for monitoring broker health from Ignition.
# Example useful topics:
#   $SYS/broker/clients/connected — current connected client count
#   $SYS/broker/messages/received — total messages received
#   $SYS/broker/messages/sent     — total messages sent
# =============================================================================
